# Models under test. Pin the IDs before the run and don't change them mid-run.
# The version that actually served each call is recorded in the run file anyway.

# Responses per (item, model). 1 gives 360 responses to hand-score. 3 would
# separate each model's run-to-run noise from the script effect, but triples
# the scoring.
samples = 1

[[models]]
name = "claude"              # frontier
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"            # the model's default, pinned explicitly
max_tokens = 16000

[[models]]
name = "gpt"                 # a model from a different lab, mid-tier
provider = "openai"
model = "gpt-6.1-terra"      # OpenAI publishes no dated snapshot; the served `model` is recorded
effort = "medium"            # the model's default, pinned explicitly (same level as Claude)
max_tokens = 16000

[[models]]
name = "open-weight"         # local, with stated multilingual support
provider = "ollama"
model = "gemma4:12b"         # Q4_K_M, ~8 GB; the weights' digest is recorded per call
base_url = "http://localhost:11434"
max_tokens = 8192            # lower than the API models: what a 16 GB machine holds
num_ctx = 16384              # Ollama's own default would be 4k on this machine
